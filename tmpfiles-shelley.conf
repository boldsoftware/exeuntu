# shelley.socket binds the Shelley CLI's socket in ~/.config/shelley at boot.
# Were the directory gone, systemd would make it, root's, and Shelley could not
# keep its database there. The mode is "-" so that a directory that exists
# keeps the mode its owner gave it; a new one gets 0755.
d /home/exedev/.config - exedev exedev -
d /home/exedev/.config/shelley - exedev exedev -
